<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>疑似线索双审</title>
<style>body{margin:0;background:#f6f6f4;font-family:"Microsoft YaHei",sans-serif;color:#222}
header{padding:16px 22px;background:#fff;border-bottom:1px solid #e5e5e0}
h1{font-size:16px;margin:0 0 6px}.sub{font-size:12px;color:#666}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding:18px 22px}
.card{background:#fff;border:1px solid #e5e5e0;border-radius:10px;overflow:hidden}
.card img{width:100%;height:220px;object-fit:cover;display:block}
.body{padding:10px 12px}.t{font-size:14px;font-weight:600}.m{font-size:12px;color:#666;margin:4px 0 10px}
.btns{display:flex;gap:8px}button{flex:1;padding:6px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer}
button.sel-ok{background:#1a7f37;color:#fff;border-color:#1a7f37}button.sel-no{background:#c62828;color:#fff;border-color:#c62828}
footer{padding:14px 22px}button.exp{padding:8px 16px;background:#1f6feb;color:#fff;border:none;border-radius:6px}
</style></head><body>
<header><h1>疑似线索双审</h1><div class="sub">MiMo 已判；请你/WorkBuddy 看图确认。不一致的会标为 conflict 保留待裁决。</div></header>
<div class="grid" id="g"></div><footer><button class="exp" id="exp">导出 roi_review.json</button></footer>
<script>
const D=__DATA__; const ans={};
const g=document.getElementById('g');
for(const d of D){
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`<img src="${d.img}"><div class="body"><div class="t">${d.title}</div>
   <div class="m">MiMo：${d.state}（${d.votes}）· ${d.frame}</div>
   <div class="btns"><button data-k="${d.key}" data-v="agree">同意</button>
   <button data-k="${d.key}" data-v="disagree">不同意</button></div></div>`;
  g.appendChild(el);
}
document.querySelectorAll('button[data-v]').forEach(b=>b.onclick=()=>{
  const k=b.dataset.k,v=b.dataset.v; ans[k]=v;
  b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel-ok','sel-no'));
  b.classList.add(v==='agree'?'sel-ok':'sel-no');
});
document.getElementById('exp').onclick=()=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(ans,null,2)],{type:'application/json'}));
  a.download='roi_review.json';a.click();};
</script></body></html>
