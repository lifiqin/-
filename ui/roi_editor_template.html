<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>场景 ROI 框选</title>
<style>body{margin:0;background:#f5f5f2;font-family:"Microsoft YaHei",sans-serif}
header{padding:14px 20px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:9}
h1{font-size:16px;margin:0 0 8px}button,select{padding:6px 10px;border:1px solid #ccc;border-radius:6px;background:#fff}
button.primary{background:#1f6feb;color:#fff;border-color:#1f6feb}
#wrap{position:relative;display:inline-block;margin:16px 20px;background:#000}
canvas{cursor:crosshair}
.tag{position:absolute;font-size:11px;color:#fff;background:#1f6feb;padding:1px 4px;border-radius:3px}
</style></head><body>
<header><h1>场景 ROI 框选（画框后选类型，点“导出 rois.json”）</h1>
<select id="t"><option value="scaffold">脚手架作业层→脚手板</option>
<option value="edge">楼层/屋面边缘→临边堆料</option>
<option value="cable">电缆走向→拖地/泡水</option>
<option value="overhead">机械/架体→外电线路距离</option></select>
<button id="undo">撤销</button><button class="primary" id="exp">导出 rois.json</button>
<span id="hint" style="margin-left:10px;color:#666;font-size:12px">在图上拖拽画框</span></header>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
const IMG="data:image/jpeg;base64,__B64__"; const F="__FRAME__";
const img=new Image(),cv=document.getElementById('c'),ctx=cv.getContext('2d');
let rects=[],cur=null,scale=1;
img.onload=()=>{const maxW=Math.min(1200,img.width);scale=maxW/img.width;cv.width=img.width*scale;cv.height=img.height*scale;ctx.drawImage(img,0,0,cv.width,cv.height);};
img.src=IMG;
function redraw(){ctx.drawImage(img,0,0,cv.width,cv.height);ctx.lineWidth=2;ctx.font='13px sans-serif';
 for(const r of rects){ctx.strokeStyle=r.type==='scaffold'?'#1f6feb':r.type==='edge'?'#d97706':r.type==='cable'?'#7c3aed':'#dc2626';ctx.strokeRect(r.x,r.y,r.w,r.h);ctx.fillStyle=ctx.strokeStyle;ctx.fillText(r.type,r.x+2,r.y-4);}
 if(cur){ctx.strokeStyle='#0f9d58';ctx.strokeRect(cur.x,cur.y,cur.w,cur.h);}}
cv.onmousedown=e=>{const b=cv.getBoundingClientRect();cur={x:e.clientX-b.left,y:e.clientY-b.top,w:0,h:0};};
cv.onmousemove=e=>{if(!cur)return;const b=cv.getBoundingClientRect();cur.w=e.clientX-b.left-cur.x;cur.h=e.clientY-b.top-cur.y;redraw();};
cv.onmouseup=()=>{if(cur&&Math.abs(cur.w)>8&&Math.abs(cur.h)>8){const r={type:document.getElementById('t').value,x:Math.min(cur.x,cur.x+cur.w),y:Math.min(cur.y,cur.y+cur.h),w:Math.abs(cur.w),h:Math.abs(cur.h)};rects.push(r);}cur=null;redraw();};
document.getElementById('undo').onclick=()=>{rects.pop();redraw();};
document.getElementById('exp').onclick=()=>{const rois=rects.map(r=>({type:r.type,box:[Math.round(r.x/scale),Math.round(r.y/scale),Math.round((r.x+r.w)/scale),Math.round((r.y+r.h)/scale)]}));
 const data={video:"__VID__",frame:F,rois};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='rois.json';a.click();};
</script></body></html>
